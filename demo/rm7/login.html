<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – demo</title>
<!--
  Demo page: it loads the theme's real CSS and JS (not a separate copy) and uses Redmine's own markup,
  so the theme and the demo cannot drift apart; any change to the theme shows up here right away.
  The color picker (gear icon), pills, badges and login animations come from theme.js.
  The theme's @import url(/application.css) (Redmine's own stylesheet) is a 404 here;
  mock-redmine-base.css stands in for it.
-->
<link rel="stylesheet" href="mock-redmine-base.css">
<link rel="stylesheet" href="../../solomonRM7/stylesheets/application.css">
<script src="../../solomonRM7/javascripts/theme.js"></script>
</head>
<body class="controller-account action-login">
<div id="wrapper"><div id="wrapper2"><div id="wrapper3">
  <nav class="top-menu" id="top-menu"><div class="general-menu"><div class="top-menu__links"></div></div><div class="profile-menu"><div id="account" class="top-menu__links"><ul><li><a class="login" href="#">Sign in</a></li></ul></div></div></nav>
  <div id="header"></div>
  <div id="main" class="nosidebar">
    <div id="content">
      <div id="login-form">
        <form action="#" method="post" onsubmit="return false">
          <label for="username">Login</label>
          <input type="text" name="username" id="username" autocomplete="username">
          <label for="password">Password <a class="lost_password" href="#">Lost password</a></label>
          <input type="password" name="password" id="password" autocomplete="current-password">
          <label for="autologin" class="inline"><input type="checkbox" name="autologin" id="autologin" value="1"> Stay logged in</label>
          <input type="submit" name="login" value="Sign in »">
        </form>
      </div>
    </div>
  </div>
</div></div></div>
<script>
  // demo: the button resets after submitting (live, the page reloads)
  document.querySelector('#login-form form').addEventListener('submit', function () {
    var b = this.querySelector('input[type="submit"]');
    setTimeout(function () { b.classList.remove('om-loading'); b.value = 'Sign in »'; }, 1800);
  });
</script>
</body>
</html>
