name: Release

# Every release (a vX.Y.Z tag) becomes a GitHub Release with the theme builds attached as zip files
# and the notes taken from CHANGELOG.md. The workflow starts in three ways, so a single missed event
# cannot skip a release:
#   1. a vX.Y.Z tag is pushed,
#   2. the release commit is pushed to main (the workflow then looks for the vX.Y.Z tag on that commit),
#   3. by hand: Actions -> Release -> Run workflow, with the tag name (for a tag that has no release yet).
# Running it more than once for the same tag is safe: it updates the existing release.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create the release for (for example v1.0.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # one release job at a time, so two triggers for the same tag never race
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Check out the tagged version
        uses: actions/checkout@v4
        with:
          # a manual run checks out the given tag; a tag or branch push uses the pushed ref
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Find the release tag
        id: tag
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag on this commit, nothing to do."
          else
            echo "Release tag: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build the zip files
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          mkdir dist
          zip -qr "dist/solomonRM6-${VERSION}.zip" solomonRM6
          zip -qr "dist/solomonRM7-${VERSION}.zip" solomonRM7
          zip -qr "dist/solomon-demo-${VERSION}.zip" demo
          ls -l dist

      - name: Collect the release notes
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 == "## " v {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then echo "Solomon ${TAG}" > notes.md; fi
          {
            echo
            echo "**Which file do I need?** \`solomonRM6\` for Redmine 6.x, \`solomonRM7\` for Redmine 7.x."
            echo "Unzip it into the \`themes/\` folder of your Redmine, precompile the assets and select the theme in Administration > Settings > Display."
          } >> notes.md

      - name: Create or update the release
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Solomon ${TAG}" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "Solomon ${TAG}" --notes-file notes.md --verify-tag
          fi
